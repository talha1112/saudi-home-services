# Render Blueprint: the database, the cache, the API and the admin web, created together.
# Step-by-step guide: docs/DEPLOY_RENDER.md
#
# Values marked `sync: false` are asked for ONCE when the blueprint is created (they are secrets or depend on URLs that
# only exist after the first deploy). Nothing secret is stored in this file.

databases:
  - name: homeservices-db
    region: frankfurt
    plan: basic-256mb # the free plan is deleted after 30 days: do not use it for a client demo
    postgresMajorVersion: "17"
    databaseName: homeservices
    user: homeservices
    ipAllowList: [] # only services in this Render account (private network); look at the data with the Render shell or a temporary rule

services:
  # ------------------------------------------------------------------------------------------------ the cache (Redis-compatible)
  - type: keyvalue
    name: homeservices-redis
    region: frankfurt
    plan: starter
    maxmemoryPolicy: noeviction # BullMQ queues must never lose keys
    ipAllowList: # the backend connects with the EXTERNAL rediss:// URL (TLS + password), which needs this list
      - source: 0.0.0.0/0
        description: any address (the connection is TLS and password protected)

  # ------------------------------------------------------------------------------------------------ the API
  - type: web
    name: homeservices-api
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: apps/backend
    # devDependencies are needed to build (Nest, Prisma) and to run the migrations at start.
    buildCommand: npm ci --include=dev && npm run build
    # Applies any new migration, then starts the API. One instance only (see the guide before scaling).
    startCommand: npx prisma migrate deploy && node dist/main.js
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY_HOPS # Render's load balancer is one proxy hop
        value: "1"
      - key: SWAGGER_ENABLED
        value: "false"
      - key: LOG_LEVEL
        value: info
      # Connections. Paste: the database's INTERNAL URL with ?sslmode=require added, and the Key Value's EXTERNAL rediss:// URL.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      # Secrets generated by Render (different for each, never in git).
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: OTP_HMAC_SECRET
        generateValue: true
      - key: DEVICE_TOKEN_ENCRYPTION_KEY # must be 32 bytes in base64: Render generates exactly that
        generateValue: true
      # Who may call the API from a browser: the admin web's address, added after its first deploy.
      - key: CORS_ORIGINS
        sync: false
      # Sign-in: no SMS provider of our own, phone numbers are verified by Firebase.
      - key: SMS_PROVIDER
        value: disabled
      - key: FIREBASE_AUTH_ENABLED
        value: "true"
      - key: FIREBASE_PROJECT_ID
        value: saudi-home-services-b8ca5
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64 # base64 of the Firebase service-account JSON (Firebase console, Project settings, Service accounts)
        sync: false
      # Push notifications through Firebase Cloud Messaging.
      - key: PUSH_PROVIDER
        value: fcm
      # Files (worker documents, profile photos, booking photos) in your private S3 bucket.
      - key: DOCUMENT_STORAGE
        value: s3
      - key: AWS_REGION
        value: ap-southeast-2
      - key: AWS_S3_BUCKET
        value: saudi-home-services-media-974913402187-ap-southeast-2-an
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # No virus scanner is connected yet. Production refuses to start with S3 and no scanner unless this is accepted on purpose.
      - key: FILE_SCANNER
        value: disabled
      - key: STORAGE_ALLOW_UNSCANNED_FILES
        value: "true"
      # Payments: cash on delivery only (online payment is "coming soon"), so no payment provider.
      - key: PAYMENT_PROVIDER
        value: disabled
      # Live location, chat and the background jobs that send push notifications.
      - key: REALTIME_ENABLED
        value: "true"
      - key: REALTIME_REDIS_ADAPTER
        value: "true"
      - key: JOBS_ENABLED
        value: "true"
      - key: DEFAULT_PHONE_REGION
        value: SA

  # ------------------------------------------------------------------------------------------------ the admin web
  - type: web
    name: homeservices-admin
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: apps/admin_web
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npx next start -p $PORT -H 0.0.0.0
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # The API's address including /api/v1, for example https://homeservices-api.onrender.com/api/v1
      - key: BACKEND_API_URL
        sync: false
