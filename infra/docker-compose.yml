# Local DEVELOPMENT services: PostgreSQL + Redis.
#
#   cd infra
#   cp .env.example .env        # then set real local passwords
#   docker compose up -d
#
# Ports are published on 127.0.0.1 only, so nothing is reachable from other machines.
# Data lives in named volumes and survives `docker compose down`. Only
# `docker compose down -v` deletes it.
#
# For production use docker-compose.prod.yml on top of this file (no published ports).

name: saudi-home-services

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in infra/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-home_services}
      # Extra throw-away database used for migration/e2e tests (created on first start only).
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-home_services_test}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Password required even locally; AOF persistence so queued jobs survive restarts.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in infra/.env}
      - --appendonly
      - "yes"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [backend]

volumes:
  postgres_data:
  redis_data:

networks:
  backend:
